<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Arif Solmaz'ın bilim, akademik hayat ve gündelik yaşam üzerine yazıları.">
  <title>Yazılar | Arif Solmaz</title>
  <style>
    :root {
      color-scheme: light;
      background: #faf9f5;
      color: #252622;
    }

    body {
      max-width: 39rem;
      margin: 0 auto;
      padding: clamp(2rem, 6vw, 4.5rem) 1.25rem;
      font: 1.125rem/1.6 Georgia, serif;
      overflow-wrap: anywhere;
    }

    a {
      color: #30564b;
      text-underline-offset: 0.18em;
    }

    a:hover {
      color: #18362e;
    }

    .home, time {
      font: 0.875rem/1.5 system-ui, sans-serif;
    }

    h1 {
      margin: 1.75rem 0 0.45rem;
      font-size: clamp(2.5rem, 8vw, 3.5rem);
      font-weight: normal;
      line-height: 1.1;
    }

    p {
      margin: 0;
    }

    #post-list {
      margin-top: 2.25rem;
    }

    article {
      border-top: 1px solid #d9d8d0;
      padding: 1.4rem 0;
    }

    article h2 {
      margin: 0.35rem 0 0.4rem;
      font-size: clamp(1.4rem, 4vw, 1.7rem);
      font-weight: normal;
      line-height: 1.3;
    }

    time, .intro, article p {
      color: #53554e;
    }
  </style>
</head>
<body>
  <header>
    <a class="home" href="/">← Arif Solmaz</a>
    <h1>Yazılar</h1>
    <p class="intro">Bilim, akademik hayat ve gündelik yaşam üzerine notlar.</p>
  </header>

  <main id="post-list" aria-label="Yazılar">
    <article>
      <time datetime="2026-11-02">2 Kasım 2026</time>
      <h2><a href="/blog/yasamayi-ne-zamana-erteliyoruz/">Yaşamayı Ne Zamana Erteliyoruz?</a></h2>
      <p>Akademik hayat, çalışma tutkusu ve sosyal yaşama ayıramadığımız zaman üzerine kişisel bir deneme.</p>
    </article>
  </main>

  <script>
    const formatDate = new Intl.DateTimeFormat('tr-TR', {
      day: 'numeric',
      month: 'long',
      year: 'numeric',
      timeZone: 'UTC'
    });

    fetch('/blog/posts.json', { cache: 'no-store' })
      .then(response => {
        if (!response.ok) throw new Error('Post index unavailable');
        return response.json();
      })
      .then(posts => {
        if (!Array.isArray(posts)) return;

        const entries = document.createDocumentFragment();
        for (const post of posts) {
          if (!post || typeof post.url !== 'string' || !/^\/blog\/[a-z0-9-]+\/$/.test(post.url)) continue;

          const article = document.createElement('article');
          const date = new Date(post.date + 'T12:00:00Z');
          if (!Number.isNaN(date.getTime())) {
            const time = document.createElement('time');
            time.dateTime = post.date;
            time.textContent = formatDate.format(date);
            article.append(time);
          }

          const heading = document.createElement('h2');
          const title = document.createElement('a');
          title.href = post.url;
          title.textContent = post.title || 'Yazı';
          heading.append(title);
          article.append(heading);

          if (post.description) {
            const description = document.createElement('p');
            description.textContent = post.description;
            article.append(description);
          }
          entries.append(article);
        }

        if (entries.childElementCount) {
          document.getElementById('post-list').replaceChildren(entries);
        }
      })
      .catch(() => { /* Keep the embedded post when the index is unavailable. */ });
  </script>
</body>
</html>
