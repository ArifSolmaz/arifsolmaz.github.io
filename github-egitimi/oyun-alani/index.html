<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Git oyun alanı — GitHub Eğitimi</title>
<meta name="description" content="Hesap açmadan, hiçbir şeyi bozma riski olmadan dene: her butonun dosyalara, geçmişe ve robota ne yaptığını canlı gör.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@400..700&family=Space+Grotesk:wght@500..700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f2ec; --card: #fbfaf6; --paper: #fffdf8; --line: #dedad0; --ink: #1b2129; --muted: #5b6470; --soft: #6b7280;
    --dark: #14181f; --accent: #e8692c; --accent-ink: #b8491a; --green: #237a52; --green-bg: #d6f0df; --red: #a33a3a; --red-bg: #f8dcdc;
    --blue: #2f6aa3; --lane1: #e8692c; --lane2: #2f6aa3; --lane3: #8a4fb0; --lane4: #237a52;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 Inter, Arial, sans-serif; }
  h1, h2, h3 { font-family: 'Space Grotesk', Arial, sans-serif; line-height: 1.15; }
  code, .mono, textarea, input.mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); padding: 7px 12px; min-height: 36px; }
  button:hover { border-color: var(--accent); }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--dark); color: #f4f2ec; border-color: var(--dark); }
  button.primary:hover { background: #2a313c; }
  button.accent { background: var(--accent); border-color: var(--accent); color: #14181f; font-weight: 600; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  input, select, textarea { font: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--paper); color: var(--ink); min-height: 36px; }
  a { color: var(--accent-ink); }

  header.top { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding: 16px 20px; background: var(--dark); color: #f4f2ec; }
  header.top h1 { font-size: 22px; }
  header.top p { color: #b9bec6; font-size: 14px; flex: 1 1 320px; }
  header.top nav { display: flex; gap: 8px; flex-wrap: wrap; }
  header.top nav a, header.top nav button { color: #f4f2ec; background: transparent; border: 1px solid #3a414d; border-radius: 8px; padding: 6px 12px; text-decoration: none; font-size: 14px; min-height: 34px; display: inline-flex; align-items: center; }

  #explain { margin: 16px 20px 0; padding: 14px 18px; border-radius: 12px; background: var(--dark); color: #f4f2ec; display: flex; gap: 14px; align-items: flex-start; }
  #explain .tag { font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 1.5px; color: var(--accent); white-space: nowrap; padding-top: 2px; }
  #explain .what { font-size: 15px; }
  #explain .cmd { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #8a919c; margin-top: 4px; }
  #explain.warn { background: #3a1d1d; }
  #explain.good { background: #12301f; }

  .layout { display: grid; gap: 16px; padding: 16px 20px 32px; grid-template-columns: 330px minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
  @media (max-width: 1250px) { .layout { grid-template-columns: 300px minmax(0, 1fr); } #col-github { grid-column: 1 / -1; } }
  @media (max-width: 820px) { .layout { grid-template-columns: minmax(0, 1fr); padding: 12px; } #explain { margin: 12px 12px 0; } }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .card + .card { margin-top: 16px; }
  .card h2 { font-size: 18px; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .card h2 .where { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1.2px; color: var(--soft); font-weight: 500; text-transform: uppercase; }
  .hint { color: var(--muted); font-size: 13.5px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row + .row { margin-top: 8px; }
  .grow { flex: 1 1 160px; min-width: 0; }

  /* missions */
  #missions ol { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .mission { border: 1px solid var(--line); border-radius: 10px; background: var(--paper); }
  .mission > button { width: 100%; text-align: left; border: 0; background: transparent; display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; }
  .mission .num { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--line); color: var(--ink); margin-top: 1px; }
  .mission.done .num { background: var(--green); color: #fff; }
  .mission.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .mission .title { font-weight: 600; }
  .mission .body { padding: 0 12px 12px 46px; font-size: 14px; display: none; }
  .mission.open .body { display: block; }
  .mission .body ol { list-style: decimal; padding-left: 18px; gap: 2px; display: block; }
  .mission .body ol li { margin: 2px 0; }
  .mission .see { margin-top: 8px; padding: 8px 10px; background: #f6efe4; border-radius: 8px; font-size: 13.5px; }
  .mission .why { margin-top: 8px; padding: 8px 10px; background: var(--green-bg); border-radius: 8px; font-size: 13.5px; display: none; }
  .mission.done .why { display: block; }
  #progress { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 6px 0 12px; }
  #progress div { height: 100%; background: var(--green); width: 0; transition: width .4s; }

  /* files + editor */
  .branchbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; }
  .branchbar label { font-size: 13px; color: var(--muted); }
  .files { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .file { display: inline-flex; gap: 6px; align-items: center; font-family: 'JetBrains Mono', monospace; font-size: 13px; }
  .file[aria-pressed="true"] { border-color: var(--dark); background: #ece8de; }
  .badge { font-family: Inter, Arial, sans-serif; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; }
  .badge.mod { background: #f6d9cc; color: #8a3412; }
  .badge.ign { background: #e9e6de; color: var(--muted); }
  .badge.cfl { background: var(--red-bg); color: var(--red); }
  textarea.editor { width: 100%; min-height: 230px; resize: vertical; font-size: 13.5px; line-height: 1.5; background: #fffdf8; white-space: pre; overflow: auto; tab-size: 2; }
  .diff { margin-top: 10px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--paper); }
  .diff .dh { display: flex; justify-content: space-between; padding: 6px 10px; background: #e9e6de; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; }
  .diff pre { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; padding: 3px 10px; white-space: pre-wrap; word-break: break-word; }
  .diff .add { background: var(--green-bg); color: #14532d; }
  .diff .del { background: var(--red-bg); color: #7a2222; }
  .diff .ctx { color: var(--muted); }
  .diff .empty { padding: 8px 10px; color: var(--muted); font-size: 13px; }
  .commitbox { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }

  /* graph */
  #graph-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); }
  #graph text { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
  #graph .node { cursor: pointer; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend span::before { box-shadow: inset 0 0 0 1px rgba(20,24,31,.35); content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; background: var(--c); }
  #commit-info { margin-top: 8px; font-size: 13.5px; }

  /* robot */
  .robot { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 12px; align-items: center; }
  @media (max-width: 520px) { .robot { grid-template-columns: 1fr; } }
  #robot-svg { width: 100%; height: auto; background: #ece8de; border-radius: 10px; }
  #robot-status { font-weight: 600; }
  #robot-status.ok { color: var(--green); } #robot-status.bad { color: var(--red); }

  /* github: issues, prs */
  .list { display: flex; flex-direction: column; gap: 6px; }
  .issue, .pr { border: 1px solid var(--line); border-radius: 10px; background: var(--paper); padding: 8px 10px; font-size: 14px; }
  .state { font-size: 11.5px; font-weight: 700; padding: 1px 8px; border-radius: 999px; margin-right: 6px; }
  .state.open { background: var(--green-bg); color: var(--green); }
  .state.closed, .state.merged { background: #e7dcf1; color: #5d2f80; }
  .pr .actions { margin-top: 8px; }
  .resolver { margin-top: 10px; padding: 10px; border-radius: 10px; background: var(--red-bg); }
  .resolver textarea { width: 100%; min-height: 150px; margin-top: 6px; font-size: 13px; white-space: pre; }
  details summary { cursor: pointer; font-weight: 600; font-size: 14px; }

  #log { list-style: none; padding: 0; max-height: 240px; overflow: auto; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
  #log li { padding: 5px 8px; border-radius: 6px; background: var(--paper); border: 1px solid var(--line); }
  #log code { color: var(--accent-ink); font-size: 12.5px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<header class="top">
  <h1 id="t-title"></h1>
  <p id="t-sub"></p>
  <nav>
    <a href="../sunum/" id="t-slides"></a>
    <a href="en/">EN</a>
    <a href="../" id="t-home"></a>
    <button id="reset"></button>
  </nav>
</header>

<div id="explain" role="status" aria-live="polite"><span class="tag" id="t-what"></span><div><div class="what" id="explain-what"></div><div class="cmd" id="explain-cmd"></div></div></div>

<div class="layout">
  <!-- missions -->
  <aside id="missions" class="card" aria-labelledby="t-missionsH">
    <h2 id="t-missionsH"></h2>
    <div class="hint" id="progress-label"></div>
    <div id="progress"><div></div></div>
    <ol id="mission-list"></ol>
  </aside>

  <!-- local computer -->
  <section id="col-local" aria-labelledby="t-local">
    <div class="card">
      <h2><span id="t-local"></span> <span class="where" id="t-local-where"></span></h2>
      <p class="hint" id="t-local-hint" style="margin-bottom:10px"></p>
      <div class="branchbar">
        <label for="branch-select" id="t-branch"></label>
        <select id="branch-select"></select>
        <input id="new-branch" class="mono grow" placeholder="readme-edits" aria-labelledby="t-newbranch-l" style="max-width:190px">
        <button id="create-branch"></button><span class="sr" id="t-newbranch-l"></span>
        <span style="flex:1"></span>
        <button id="pull"></button>
        <button id="push" class="primary"></button>
      </div>
      <div class="files" id="files" role="group"></div>
      <label for="editor" class="sr" id="t-editor-l"></label>
      <textarea id="editor" class="editor" spellcheck="false"></textarea>
      <div class="diff" id="work-diff"></div>
      <div class="commitbox">
        <div class="row">
          <label for="commit-msg" class="sr" id="t-msg-l"></label>
          <input id="commit-msg" class="grow">
          <button id="commit" class="accent"></button>
        </div>
        <div class="row"><button id="discard"></button><span class="hint" id="t-commit-hint"></span></div>
      </div>
    </div>
    <div class="card">
      <h2><span id="t-log"></span></h2>
      <ul id="log"></ul>
    </div>
  </section>

  <!-- github -->
  <section id="col-github" aria-labelledby="t-github">
    <div class="card">
      <h2><span id="t-robot"></span> <span class="where" id="t-robot-where"></span></h2>
      <div class="robot">
        <svg id="robot-svg" viewBox="0 0 400 130" role="img" aria-labelledby="robot-status"></svg>
        <div><div id="robot-status"></div><div class="hint" id="robot-detail"></div></div>
      </div>
    </div>
    <div class="card">
      <h2><span id="t-github"></span> <span class="where" id="t-history"></span></h2>
      <div id="graph-wrap"><svg id="graph" role="img" aria-labelledby="t-history"></svg></div>
      <div class="legend" id="legend"></div>
      <div id="commit-info" class="hint"></div>
    </div>
    <div class="card">
      <h2 id="t-prs"></h2>
      <details id="new-pr-box">
        <summary id="t-newpr"></summary>
        <div class="row" style="margin-top:8px"><label for="pr-from" id="t-from" class="hint"></label><select id="pr-from"></select><span class="hint">→ main</span></div>
        <div class="row"><input id="pr-title" class="grow" aria-labelledby="t-prtitle-l"><span class="sr" id="t-prtitle-l"></span></div>
        <div class="row"><textarea id="pr-body" class="grow" rows="2" aria-labelledby="t-prbody-l"></textarea><span class="sr" id="t-prbody-l"></span></div>
        <div class="row"><button id="open-pr" class="primary"></button></div>
      </details>
      <div class="list" id="prs" style="margin-top:10px"></div>
    </div>
    <div class="card">
      <h2 id="t-issuesH"></h2>
      <div class="list" id="issues"></div>
      <div class="row" style="margin-top:10px"><button id="teammate"></button><span class="hint" id="t-teammate-hint"></span></div>
    </div>
  </section>
</div>

function robotState() {
  const src = (snap(st.remote.main)['firmware/main.ino'] || '');
  if (hasMarkers(src)) return { ok: false, mode: 'broken', msg: S('rbCompile'), detail: S('rbCompileD') };
  const kp = parseFloat((src.match(/Kp\s*=\s*(-?[\d.]+)/) || [])[1]);
  const l = (src.match(/(SOL_MOTOR|LEFT_MOTOR)\s*=\s*(\d+)/) || [])[2], r = (src.match(/(SAG_MOTOR|RIGHT_MOTOR)\s*=\s*(\d+)/) || [])[2];
  if (isNaN(kp)) return { ok: false, mode: 'broken', msg: S('rbCompile'), detail: S('rbNoKp') };
  if (l && r && l === r) return { ok: false, mode: 'spin', msg: S('rbPins'), detail: S('rbPinsD', { p: l }) };
  if (kp > 2.5) return { ok: false, mode: 'wobble', msg: S('rbWobble'), detail: S('rbWobbleD', { kp }) };
  if (kp < 0.6) return { ok: false, mode: 'drift', msg: S('rbDrift'), detail: S('rbDriftD', { kp }) };
  return { ok: true, mode: 'ok', msg: S('rbOk'), detail: S('rbOkD', { kp }) };
}
function renderRobot() {
  const r = robotState(); const s = el('robot-svg');
  let track = 'M10 70'; for (let x = 10; x <= 390; x += 10) track += ' L' + x + ' ' + (70 + 22 * Math.sin(x / 45)).toFixed(1);
  let path = 'M10 70';
  for (let x = 10; x <= 390; x += 5) {
    let y = 70 + 22 * Math.sin(x / 45);
    if (r.mode === 'wobble') y += 14 * Math.sin(x / 8);
    if (r.mode === 'drift') y += Math.min(46, Math.max(0, (x - 120) * 0.25));
    path += ' L' + x + ' ' + y.toFixed(1);
  }
  const col = r.ok ? '#237a52' : '#a33a3a';
  let robot;
  if (r.mode === 'broken') robot = '<g transform="translate(40 70)"><circle r="11" fill="#9aa1ab"/><text x="0" y="4" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">!</text></g>';
  else if (r.mode === 'spin') robot = '<g transform="translate(60 70)"><g><circle r="11" fill="' + col + '"/><rect x="-2" y="-14" width="4" height="8" fill="#fff"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/></g></g>';
  else robot = '<g><circle r="11" fill="' + col + '"/><circle r="4" fill="#fff"/><animateMotion dur="7s" repeatCount="indefinite" path="' + path + '"/></g>';
  s.innerHTML = '<path d="' + track + '" fill="none" stroke="#14181f" stroke-width="6" stroke-linecap="round"/>' + robot;
  const rs = el('robot-status'); rs.textContent = r.msg; rs.className = r.ok ? 'ok' : 'bad';
  el('robot-detail').textContent = r.detail;
}

const MISSIONS = [
  ['edit', f => f.edited], ['commit', f => f.commits >= 1], ['push', f => f.pushed], ['branch', f => f.branched],
  ['safe', f => f.branchCommit && f.sawMainUnchanged], ['pr', f => f.prOpened && f.prLinked], ['merge', f => f.approved && f.issueClosed],
  ['pull', f => f.pulledAfterMerge], ['ignore', f => f.ignoredSeen], ['revert', f => f.robotBroken && f.revertPushed && robotState().ok],
  ['conflict', f => f.conflictResolved], ['rejected', f => f.rejected && f.pushAfterReject], ['delete', f => f.deleted]
];
function renderMissions() {
  let cur = -1, count = 0;
  const newly = [];
  MISSIONS.forEach(([k, chk], i) => { const d = !!chk(st.flags); if (d && !st.done[k]) newly.push(k); if (d) st.done[k] = true; });
  MISSIONS.forEach(([k], i) => { if (st.done[k]) count++; else if (cur < 0) cur = i; });
  if (st.openM == null || newly.length) st.openM = cur;
  el('mission-list').innerHTML = MISSIONS.map(([k], i) => {
    const m = T.missions[k], d = st.done[k];
    return '<li class="mission' + (d ? ' done' : '') + (i === cur ? ' current' : '') + (i === st.openM ? ' open' : '') + '"><button aria-expanded="' + (i === st.openM) + '" data-i="' + i + '"><span class="num">' + (d ? '✓' : i + 1) + '</span><span class="title">' + esc(m.t) + '</span></button>' +
      '<div class="body"><ol>' + m.do.map(x => '<li>' + x + '</li>').join('') + '</ol><div class="see"><b>' + esc(S('seeLabel')) + '</b> ' + m.see + '</div><div class="why"><b>' + esc(S('whyLabel')) + '</b> ' + m.why + '</div></div></li>';
  }).join('');
  el('mission-list').querySelectorAll('.mission > button').forEach(b => b.onclick = () => { st.openM = st.openM === +b.dataset.i ? -1 : +b.dataset.i; save(); renderMissions(); });
  el('progress').firstElementChild.style.width = (count / MISSIONS.length * 100) + '%';
  el('progress-label').textContent = S('progress', { n: count, t: MISSIONS.length });
  if (newly.length) { const m = T.missions[newly[newly.length - 1]]; const prev = st.last || { what: '', cmd: '' }; st.last = { kind: 'good', what: (prev.what ? prev.what + '  ✓ ' : '✓ ') + S('missionDone', { t: m.t }), cmd: prev.cmd }; }
}
const strip = h => h.replace(/<[^>]+>/g, '');

function renderAll(withSave) {
  renderBranches(); renderFiles(); renderGraph(); renderRobot(); renderPRs(); renderIssues(); renderMissions(); renderLog();
  if (withSave !== false) save(); else save();
}

/* static text */
function staticText() {
  const set = (id, k) => { const e = el(id); if (e) e.textContent = S(k); };
  ['title', 'sub', 'slides', 'home', 'what', 'missionsH', 'local', 'local-hint', 'branch', 'log', 'robot', 'robot-where', 'github', 'history', 'prs', 'newpr', 'from', 'issuesH', 'teammate-hint', 'editor-l', 'msg-l', 'newbranch-l', 'prtitle-l', 'prbody-l'].forEach(k => set('t-' + k, k));
  set('reset', 'resetBtn'); set('create-branch', 'createBranch'); set('pull', 'pullBtn'); set('commit', 'commitBtn'); set('discard', 'discardBtn'); set('open-pr', 'openPR'); set('teammate', 'teammateBtn');
  el('commit-msg').placeholder = S('msgPh'); el('pr-title').placeholder = S('prTitlePh'); el('pr-body').placeholder = S('prBodyPh');
}

/* wire */
el('editor').addEventListener('input', e => { doEdit(e.target.value); renderFiles(); renderMissions(); renderLog(); save(); });
el('branch-select').onchange = e => { doSwitch(e.target.value); renderAll(); };
el('create-branch').onclick = () => { doCreateBranch(); renderAll(); };
el('new-branch').onkeydown = e => { if (e.key === 'Enter') { doCreateBranch(); renderAll(); } };
el('commit').onclick = () => { doCommit(); renderAll(); };
el('commit-msg').onkeydown = e => { if (e.key === 'Enter') { doCommit(); renderAll(); } };
el('discard').onclick = () => { doDiscard(); renderAll(); };
el('push').onclick = () => { doPush(); renderAll(); };
el('pull').onclick = () => { doPull(); renderAll(); };
el('open-pr').onclick = () => { doOpenPR(); renderAll(); };
el('teammate').onclick = () => { doTeammate(); renderAll(); };
el('reset').onclick = () => { if (confirm(S('resetConfirm'))) { st = fresh(); renderAll(); } };

st = load() || fresh();
staticText(); renderAll();
</script>
</body>
</html>
