name: Update lab page data

on:
  schedule:
    # Mondays 03:30 UTC — after the weekend's arXiv/ADS indexing settles
    - cron: "30 3 * * 1"
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "cv.tex"
      - "publications.json"
      - "lab/publication-filters.json"
      - "lab/ads-name-publications.json"
      - "scripts/build_lab_data.py"
      - "scripts/fetch_ads.py"
      - ".github/workflows/update-lab.yml"

permissions:
  contents: write

concurrency:
  group: update-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh publications from NASA ADS
        # The configured ADS token refreshes ORCID and filtered-author results.
        # A failure is visible in Actions; the published cached files stay intact.
        env:
          ADS_API_TOKEN: ${{ secrets.ADS_API_TOKEN }}
        run: python3 scripts/fetch_ads.py

      - name: Rebuild lab data from CV + publications
        run: python3 scripts/build_lab_data.py

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab/lab-data.json lab/ads-publications.json lab/ads-name-publications.json
          if git diff --cached --quiet; then
            echo "lab data unchanged"
          else
            git commit -m "chore(lab): refresh lab data from CV and ADS"
            git push
          fi
