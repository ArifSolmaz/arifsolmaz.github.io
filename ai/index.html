<template id="content-akademi"><article class="reading"><header><p class="overline">Üniversiteler ve araştırma ekipleri</p><h2 id="reading-title">Akademide<br>yapay zekâ.</h2></header><div class="reading-body"><p>Akademisyenler, lisansüstü öğrenciler ve araştırma destek ekipleri için araştırmanın her aşamasında bilinçli kullanım.</p><ul><li>Literatür taraması ve kaynak doğrulama</li><li>Bilimsel metinleri yapılandırma</li><li>Kod yazma, hata ayıklama ve analiz desteği</li><li>Akademik dürüstlük, mahremiyet ve çıktı kontrolü</li></ul><p class="practice"><em>Birlikte deneyelim:</em> Bir araştırma sorusundan, doğrulanabilir kaynaklara dayanan bir analiz planına ilerleyelim.</p><a class="programme-link" data-program="Akademide yapay zekâ" href="mailto:arif.solmaz@istun.edu.tr?subject=Akademide%20yapay%20zeka">Bu eğitimi konuşalım </a></div></article></template>
<template id="content-egitim"><article class="reading"><header><p class="overline">Öğretmenler ve eğitim yöneticileri</p><h2 id="reading-title">Öğrenmeye<br>yeni bir bakış.</h2></header><div class="reading-body"><p>Öğretmenler ve eğitim yöneticileri için dersin hedefinden başlayıp öğrencinin ihtiyacına uzanan yapay zekâ uygulamaları.</p><ul><li>Ders planı ve farklı düzeylere uygun materyal</li><li>Soru, rubrik ve geri bildirim taslakları</li><li>İçeriğin doğruluğunu ve uygunluğunu değerlendirme</li><li>Öğrencilere sorumlu kullanım rehberliği</li></ul><p class="practice"><em>Birlikte deneyelim:</em> Bir kazanım için ders etkinliği ve değerlendirme rubriği tasarlayalım.</p><a class="programme-link" data-program="Eğitimciler için yapay zekâ" href="mailto:arif.solmaz@istun.edu.tr?subject=Egitimciler%20icin%20yapay%20zeka">Bu eğitimi konuşalım </a></div></article></template>
<template id="content-kurum"><article class="reading"><header><p class="overline">Kurum çalışanları ve ekip liderleri</p><h2 id="reading-title">İşinize<br>yeni olasılıklar.</h2></header><div class="reading-body"><p>Şirketler, kamu kurumları ve sivil toplum ekipleri için günlük görevlerden yola çıkan bir çalışma.</p><ul><li>Açık talimat verme ve bağlam oluşturma</li><li>Belge, rapor, e-posta ve sunum taslakları</li><li>Uzun metinleri özetleme ve karşılaştırma</li><li>Hassas verileri koruma ve sonuçları kontrol etme</li></ul><p class="practice"><em>Birlikte deneyelim:</em> Örnek belgelerden bir yönetici özeti hazırlayalım; iddiaların dayanaklarını kontrol edelim.</p><a class="programme-link" data-program="İş hayatında yapay zekâ" href="mailto:arif.solmaz@istun.edu.tr?subject=Is%20hayatinda%20yapay%20zeka">Bu eğitimi konuşalım </a></div></article></template>
<template id="content-veri"><article class="reading"><header><p class="overline">Veri Okuryazarlığı · Bağımsız program</p><h2 id="reading-title">Sayıların<br>ötesini görmek.</h2></header><div class="reading-body"><p>Tüm gruplara açık, bağımsız bir eğitim. Bir tabloyu, grafiği veya sayısal iddiayı bilinçli değerlendirmek isteyen herkes için. Kodlama bilgisi gerekmez.</p><ul><li>Doğru soru, veri kaynağı ve veri kalitesi</li><li>Ortalama, medyan, dağılım ve belirsizlik</li><li>Grafikleri okuma ve yanıltıcı sunumları fark etme</li><li>Korelasyon, nedensellik ve bulguları anlatma</li></ul><p class="practice"><em>Birlikte deneyelim:</em> Bir tablodan uygun bir grafik üretelim. Bulguyu, verinin sınırlarını da belirterek paylaşalım.</p><a class="programme-link" data-program="Veri Okuryazarlığı" href="mailto:arif.solmaz@istun.edu.tr?subject=Veri%20Okuryazarligi">Bu eğitimi konuşalım </a></div></article></template>
<template id="content-yaklasim"><article class="reading about-reading"><header><p class="overline">Bir araştırmacının merakıyla</p><h2 id="reading-title">Önce bir soru.<br>Sonra birlikte.</h2></header><div class="reading-body"><p>Gökbilim çalışmalarımda uzay teleskobu verileri, zaman serileri ve makine öğrenmesi üzerine çalışıyorum. Eğitimlere de aynı yaklaşımı taşıyorum: iyi sorular sormak, çıktıları doğrulamak ve belirsizliği görebilmek.</p><p>Katılımcı profilini ve hedefinizi konuşur, içeriği birlikte şekillendiririz. Çevrim içi veya yüz yüze; bir seminer, uygulamalı atölye ya da çok oturumlu program.</p><p>Kendi alanınızdan örneklerle çalışır, öğrendiklerinizi günlük pratiğinize taşımak için bir başlangıç yaparız.</p><a class="programme-link" data-program="Kuruma özel eğitim" href="mailto:arif.solmaz@istun.edu.tr">Bir eğitim planlayalım</a></div></article></template>
